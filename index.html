<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rassegna Edile — Il quotidiano online dell'edilizia italiana</title>
    <meta
      name="description"
      content="Rassegna Edile è la testata online verticale sull'edilizia: ristrutturazioni, serramenti, efficienza energetica, materiali, impianti, incentivi e normative. Guide tecniche e notizie per professionisti e privati."
    />
    <link rel="canonical" href="https://www.rassegnaedile.it/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#16305e" />
    <meta name="author" content="Rassegna Edile — Redazione" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rassegna Edile" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="Rassegna Edile — Il quotidiano online dell'edilizia italiana" />
    <meta
      property="og:description"
      content="Ristrutturazioni, serramenti, efficienza energetica, materiali, impianti, incentivi e normative: guide tecniche autorevoli per l'edilizia italiana."
    />
    <meta property="og:url" content="https://www.rassegnaedile.it/" />
    <meta property="og:image" content="https://www.rassegnaedile.it/og-cover.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rassegna Edile — Il quotidiano online dell'edilizia italiana" />
    <meta
      name="twitter:description"
      content="Ristrutturazioni, serramenti, efficienza energetica, materiali, impianti, incentivi e normative."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Rassegna Edile — RSS"
      href="/feed.xml"
    />

    <!-- Font con display=swap per non bloccare il rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: Organization + WebSite con SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.rassegnaedile.it/#organization",
            "name": "Rassegna Edile",
            "url": "https://www.rassegnaedile.it/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.rassegnaedile.it/logo.png",
              "width": 1761,
              "height": 278
            },
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://www.rassegnaedile.it/#website",
            "url": "https://www.rassegnaedile.it/",
            "name": "Rassegna Edile",
            "description": "Il quotidiano online dell'edilizia italiana",
            "publisher": { "@id": "https://www.rassegnaedile.it/#organization" },
            "inLanguage": "it-IT",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.rassegnaedile.it/cerca/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
