<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16305e" />
    <meta name="author" content="Rassegna Edile — Redazione" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Rassegna Edile — RSS"
      href="/feed.xml"
    />

    <!-- Font con display=swap per non bloccare il rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data invariante: Organization + WebSite con SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.rassegnaedile.it/#organization",
            "name": "Rassegna Edile",
            "url": "https://www.rassegnaedile.it/",
            "description": "Magazine online verticale sull'edilizia italiana: ristrutturazioni, efficienza energetica, incentivi, materiali, impianti e normative.",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.rassegnaedile.it/logo.svg",
              "width": 512,
              "height": 512
            },
            "publishingPrinciples": "https://www.rassegnaedile.it/redazione/",
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "editorial",
              "email": "redazione@rassegnaedile.it",
              "availableLanguage": "Italian"
            },
            "parentOrganization": {
              "@type": "Organization",
              "name": "Domus Group S.r.l.",
              "legalName": "Domus Group S.r.l.",
              "vatID": "IT13132010961",
              "email": "domusgroupsrl@legalmail.it",
              "address": {
                "@type": "PostalAddress",
                "streetAddress": "Via Aurelio Saffi 29",
                "postalCode": "20123",
                "addressLocality": "Milano",
                "addressRegion": "MI",
                "addressCountry": "IT"
              }
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.rassegnaedile.it/#website",
            "url": "https://www.rassegnaedile.it/",
            "name": "Rassegna Edile",
            "description": "Il quotidiano online dell'edilizia italiana",
            "publisher": { "@id": "https://www.rassegnaedile.it/#organization" },
            "inLanguage": "it-IT",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://www.rassegnaedile.it/cerca/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
